name: V0.1 Rust Tunnel CI
on:
  push:
    branches: [main, 'feat/v0.1-rust-tunnel']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native Rust tests
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo test --locked
          cargo build --release --locked
      - name: Real encrypted loopback E2E
        shell: bash
        run: python tests/e2e.py
      - name: Package CLI build
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/localtunnel.exe dist/
          else
            cp target/release/localtunnel dist/
          fi
          (cd dist && sha256sum localtunnel* > SHA256SUMS)
      - name: Native CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localtunnel-cli-${{ matrix.os }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v01-evidence-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
