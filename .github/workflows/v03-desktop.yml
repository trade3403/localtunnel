name: V0.3 Windows Desktop CI
on:
  push:
    branches: ['feat/v0.3-windows-client', 'feat/v0.3-client-security', 'feat/v0.3-client-reliability']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          python --version
      - name: Generate application icons
        run: python apps/desktop/scripts/create_icons.py
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Build Vue frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Prepare pinned Rathole engine and embed binary digest
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tests'); import e2e; d=Path('.runtime').resolve(); d.mkdir(exist_ok=True); print(e2e.engine(d))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = (Resolve-Path .runtime/rathole.exe).Path
          $digest = (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne "a91717eb37b3dc25c9d2391aca6a1b1f8edde9a3de626264718811ff8113e55b") { throw "Unexpected pinned engine binary SHA-256" }
          $resources = "apps/desktop/src-tauri/resources/engine"
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item -LiteralPath $engine -Destination (Join-Path $resources "rathole.exe")
          "LOCALTUNNEL_TEST_ENGINE=$engine" >> $env:GITHUB_ENV
          "LOCALTUNNEL_ENGINE_SHA256=$digest" >> $env:GITHUB_ENV
          Write-Host "Verified archive member SHA-256: $digest"
      - name: Rust desktop unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop supervisor real encrypted TCP lifecycle
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml real_engine_supervisor_lifecycle -- --ignored --nocapture
      - name: Build Windows NSIS preview installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis -- --locked
      - name: Real Windows SCM service lifecycle
        run: |
          New-Item -ItemType Directory -Force desktop-evidence | Out-Null
          & apps/desktop/scripts/service_smoke.ps1 -Executable apps/desktop/src-tauri/target/release/localtunnel-desktop.exe -Evidence (Join-Path (Get-Location) "desktop-evidence/service-smoke.json")
      - name: Real Windows service encrypted tunnel
        run: python apps/desktop/scripts/service_tunnel_e2e.py apps/desktop/src-tauri/target/release/localtunnel-desktop.exe desktop-evidence/service-tunnel.json
      - name: Build real management API for installed Windows device pairing
        run: |
          cargo build --locked --manifest-path crates/server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $management = (Resolve-Path crates/server/target/debug/localtunnel-server.exe).Path
          "LOCALTUNNEL_TEST_MANAGEMENT=$management" >> $env:GITHUB_ENV
      - name: Verify dependency locks unchanged
        run: |
          git diff --exit-code -- apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock crates/server/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Silent installer, real installed GUI E2E and native window smoke
        run: |
          New-Item -ItemType Directory -Force desktop-evidence | Out-Null
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          & apps/desktop/scripts/installer_smoke.ps1 -Installer $installers[0].FullName -Evidence (Join-Path (Get-Location) "desktop-evidence/installer-smoke.json")
      - name: Require complete V0.4 desktop evidence
        run: |
          python tests/verify_v04_evidence.py desktop desktop-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force desktop-evidence | Out-Null
          if (Test-Path apps/desktop/package-lock.json) { Copy-Item apps/desktop/package-lock.json desktop-evidence/ }
          if (Test-Path apps/desktop/src-tauri/Cargo.lock) { Copy-Item apps/desktop/src-tauri/Cargo.lock desktop-evidence/ }
          if (Test-Path test-results/engine.json) { Copy-Item test-results/engine.json desktop-evidence/ }
          "commit=$env:GITHUB_SHA" | Set-Content desktop-evidence/build.txt
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Get-FileHash -Algorithm SHA256 | Format-List | Out-File -Append desktop-evidence/build.txt
      - name: Upload preview installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localtunnel-v03-windows-preview
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v03-desktop-evidence
          path: desktop-evidence/
          retention-days: 7
