name: V0.4 Management API CI
on:
  push:
    branches: ['feat/v0.4-management-api', 'feat/v0.5-security-stability', 'feat/v0.6-cross-platform', 'feat/v0.7-udp-quic', 'feat/v0.8-commercial-management', 'feat/v0.9-multi-node']
  pull_request:
    paths:
      - 'crates/server/**'
      - 'apps/admin/**'
      - 'tests/verify_v04_evidence.py'
      - 'docs/v0.9.md'
      - '.github/workflows/v04-management.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management:
    # Playwright 1.56.1 supports Ubuntu 24.04, not the current 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust build and tests
        working-directory: crates/server
        run: |
          rustc --version
          cargo test --locked
          cargo build --release --locked
      - name: Real management HTTP and SQLite lifecycle
        run: python3 crates/server/tests/http_e2e.py crates/server/target/release/localtunnel-server management-evidence/http.json
      - name: Real consistent SQLite snapshot and isolated recovery
        run: python3 crates/server/tests/backup_e2e.py crates/server/target/release/localtunnel-server management-evidence/backup.json
      - name: Real management resource admission and deadline
        run: python3 crates/server/tests/protection_e2e.py crates/server/target/release/localtunnel-server management-evidence/protection.json
      - name: Real sustained management workload and measured resource recovery
        run: python3 crates/server/tests/load_e2e.py crates/server/target/release/localtunnel-server management-evidence/load.json
      - name: Real HTTP transport connection and header limits
        run: python3 crates/server/tests/transport_e2e.py crates/server/target/release/localtunnel-server management-evidence/transport.json
      - name: Real administrator authentication lifecycle
        run: python3 crates/server/tests/auth_e2e.py crates/server/target/release/localtunnel-server management-evidence/auth.json
      - name: Real device enrollment and authorization lifecycle
        run: python3 crates/server/tests/devices_e2e.py crates/server/target/release/localtunnel-server management-evidence/devices.json
      - name: Real device desired configuration and heartbeat lifecycle
        run: python3 crates/server/tests/sync_e2e.py crates/server/target/release/localtunnel-server management-evidence/sync.json
      - name: Real administrator mapping CRUD and revision lifecycle
        run: python3 crates/server/tests/mappings_e2e.py crates/server/target/release/localtunnel-server management-evidence/mappings.json
      - name: Real commercial inventory upgrade and owner isolation
        run: python3 crates/server/tests/commercial_e2e.py crates/server/target/release/localtunnel-server management-evidence/commercial.json
      - name: Real independent relay credential issuance, rotation and revocation
        run: python3 crates/server/tests/relay_identity_e2e.py crates/server/target/release/localtunnel-server management-evidence/relay-identity.json
      - name: Real three independent relay control processes and recovery
        run: python3 crates/server/tests/relay_process_e2e.py crates/server/target/release/localtunnel-server management-evidence/relay-process.json
      - name: Real node capacity policy, health, upgrade and restore
        run: python3 crates/server/tests/node_policy_e2e.py crates/server/target/release/localtunnel-server management-evidence/node-policy.json
      - name: Real atomic relay reservation and scheduling isolation
        run: python3 crates/server/tests/scheduling_e2e.py crates/server/target/release/localtunnel-server management-evidence/scheduling.json
      - name: Real legacy SQLite migration and UDP desired metadata lifecycle
        run: python3 crates/server/tests/udp_metadata_e2e.py crates/server/target/release/localtunnel-server management-evidence/udp-metadata.json
      - name: Install DNS query utility
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils nginx curl openssl
      - name: Real node inventory and DNS TXT proof lifecycle
        run: python3 crates/server/tests/domains_e2e.py crates/server/target/release/localtunnel-server management-evidence/domains.json
      - name: Build existing core CLI for preview integration
        run: cargo build --release --locked
      - name: Real authorized TCP management draft to guarded Noise echo preview
        run: python3 crates/server/tests/tcp_preview_e2e.py crates/server/target/release/localtunnel-server management-evidence/tcp-preview.json
      - name: Real authorized UDP management draft to guarded Noise echo preview
        run: python3 crates/server/tests/udp_preview_e2e.py crates/server/target/release/localtunnel-server management-evidence/udp-preview.json
      - name: Actual management draft to encrypted tunnel and gateway preview
        run: python3 crates/server/tests/preview_e2e.py crates/server/target/release/localtunnel-server management-evidence/preview.json
      - name: Real HTTPS management preview, certificate rotation and rollback
        run: python3 crates/server/tests/tls_preview_e2e.py crates/server/target/release/localtunnel-server management-evidence/tls-preview.json
      - name: Install committed admin dependency graph
        working-directory: apps/admin
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Build Vue admin and install Chromium
        working-directory: apps/admin
        run: |
          npm run build
          npx --no-install playwright install chromium --with-deps
      - name: Real browser admin login and API-backed management
        working-directory: apps/admin
        run: npm run test:e2e -- ../../crates/server/target/release/localtunnel-server ../../management-evidence/admin-browser.json
      - name: Require complete V0.4 and V0.5 management evidence
        run: python3 tests/verify_v04_evidence.py management-v09 management-evidence
      - name: Collect admin dependency lock and build
        if: always()
        run: |
          mkdir -p management-evidence
          if test -f apps/admin/package-lock.json; then cp apps/admin/package-lock.json management-evidence/admin-package-lock.json; fi
          if test -d apps/admin/dist; then cp -r apps/admin/dist management-evidence/admin-dist; fi
      - name: Verify committed dependency lock unchanged
        run: git diff --exit-code -- crates/server/Cargo.lock apps/admin/package-lock.json
      - name: Collect committed lock
        if: always()
        run: |
          mkdir -p management-evidence
          if test -f crates/server/Cargo.lock; then cp crates/server/Cargo.lock management-evidence/Cargo.lock; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v04-management-evidence
          path: management-evidence/
          retention-days: 7
          if-no-files-found: error
