[package]
name = "localtunnel-server"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

argon2 = "=0.5.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[profile.release]
strip = true
