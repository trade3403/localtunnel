[package]
name = "localtunnel-server"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[profile.release]
strip = true
