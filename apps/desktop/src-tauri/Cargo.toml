[package]
name = "localtunnel-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
localtunnel = { path = "../../.." }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Services", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
zeroize = "1"
