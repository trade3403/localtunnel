[package]
name = "localtunnel-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
localtunnel = { path = "../../.." }

[profile.release]
lto = "thin"
strip = true
